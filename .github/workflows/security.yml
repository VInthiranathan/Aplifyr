name: Security checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'
      - run: dotnet restore backend/Aplifyr.Api.csproj
      - run: dotnet list backend/Aplifyr.Api.csproj package --vulnerable --include-transitive --format json > /tmp/backend-audit.json
      - name: Reject known high or critical backend dependency vulnerabilities
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/backend-audit.json'))
          if data.get('problems') or not data.get('projects'):
              raise SystemExit('Dependency audit could not complete')
          found = []
          for project in data.get('projects', []):
              for framework in project.get('frameworks', []):
                  for package in framework.get('topLevelPackages', []) + framework.get('transitivePackages', []):
                      for vulnerability in package.get('vulnerabilities', []):
                          if vulnerability.get('severity', '').lower() in ('high', 'critical'):
                              found.append(package['id'])
          if found:
              raise SystemExit('Vulnerable dependencies: ' + ', '.join(sorted(set(found))))
          PY
