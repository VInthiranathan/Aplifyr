name: CI

on:
  push:
    branches:
      - main
      - render/backend-dockerfile
  pull_request:
    branches:
      - main
      - render/backend-dockerfile

permissions:
  contents: write

jobs:
  rename-metadata:
    if: github.event_name == 'push' && github.ref == 'refs/heads/render/backend-dockerfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename frontend lock metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/package-lock.json')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"examensarbete-frontend"', '"aplifyr-frontend"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit metadata rename if needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lock metadata already uses Aplifyr."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Rename frontend lock metadata to Aplifyr"
          git push

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore
        run: dotnet restore backend/Aplifyr.Api.csproj
      - name: Build
        run: dotnet build backend/Aplifyr.Api.csproj --configuration Release --no-restore
      - name: Docker build
        run: docker build -f backend/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
