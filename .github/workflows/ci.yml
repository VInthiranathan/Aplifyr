name: CI

on:
  push:
    branches:
      - main
      - render/backend-dockerfile
  pull_request:
    branches:
      - main
      - render/backend-dockerfile

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'
      - name: Restore
        run: dotnet restore backend/Aplifyr.Api.csproj
      - name: Build
        run: dotnet build backend/Aplifyr.Api.csproj --configuration Release --no-restore
      - name: Security boundary tests
        run: dotnet run --project tests/Aplifyr.SecurityTests --configuration Release
      - name: Matching regression tests
        run: dotnet run --project tests/Aplifyr.Matching.Tests --configuration Release
      - name: CV regression tests
        run: dotnet run --project tests/Aplifyr.CvTests --configuration Release
      - name: Workspace regression tests
        run: dotnet run --project tests/Aplifyr.WorkspaceTests --configuration Release
      - name: Docker build
        run: docker build -f backend/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Launch tool syntax
        run: |
          for tool in ../scripts/*.cjs ../scripts/lib/*.cjs; do
            node --check "$tool"
          done
      - name: Build
        env:
          BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Job runtime without require ESM
        run: node --no-experimental-require-module scripts/check-job-runtime.cjs
