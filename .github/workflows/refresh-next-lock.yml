name: Refresh Next.js security lockfile (temporary)
on:
  push:
    branches: [fix/nextjs-security-16-4-6]
permissions:
  contents: write
jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
      - name: Rebuild lockfile for pinned security release
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        working-directory: frontend
        run: npm ci
      - name: Audit complete frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit verified lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/refresh-next-lock.yml
          git commit -m "fix: lock and verify patched Next.js dependencies"
          git push origin HEAD:fix/nextjs-security-16-4-6
